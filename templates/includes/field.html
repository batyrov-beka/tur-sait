<div class="field{% if field.errors %} field--error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<small class="field__help">{{ field.help_text|safe }}</small>{% endif %}
  {% for error in field.errors %}<small class="field__error">{{ error }}</small>{% endfor %}
</div>
